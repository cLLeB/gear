name: Update Nix sources

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.6)"
        required: true
  # Callable from release-please.yml once the release is built. A release cut by
  # release-please carries GITHUB_TOKEN, and GITHUB_TOKEN-created events never
  # start a new workflow run, so a `release: published` trigger would not fire.
  workflow_call:
    inputs:
      tag:
        description: "Release tag"
        required: true
        type: string

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Normalize tag
        id: tag
        env:
          RAW_TAG: ${{ inputs.tag }}
        run: |
          case "$RAW_TAG" in
            v*) TAG="$RAW_TAG" ;;
            *) TAG="v$RAW_TAG" ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # The macOS build is one universal archive. Match it by pattern: its file
      # name is chosen by the release tooling and may carry the version.
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/assets" \
            --pattern "Gear_${VERSION}_amd64.deb" \
            --pattern "Gear*universal.app.tar.gz"

      - name: Update nix/sources.json
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          hash_sri() {
            echo "sha256-$(openssl dgst -sha256 -binary "$1" | base64 | tr -d '\n')"
          }
          cd "$RUNNER_TEMP/assets"
          DARWIN=$(ls Gear*universal.app.tar.gz)
          [ "$(echo "$DARWIN" | wc -l)" -eq 1 ] \
            || { echo "::error::expected one universal macOS archive, got: $DARWIN"; exit 1; }
          jq -n \
            --arg version "$VERSION" \
            --arg darwinAsset "$DARWIN" \
            --arg linux "$(hash_sri "Gear_${VERSION}_amd64.deb")" \
            --arg darwin "$(hash_sri "$DARWIN")" \
            '{version: $version, darwinAsset: $darwinAsset, hashes: {"x86_64-linux": $linux, darwin: $darwin}}' \
            > "$GITHUB_WORKSPACE/nix/sources.json"

      - name: Commit if the sources moved
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if git diff --quiet -- nix/sources.json; then
            echo "nix/sources.json already matches $TAG."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nix/sources.json
          git commit -m "chore: point the Nix package at $TAG"
          # sync-lockfile may have pushed to main since the checkout.
          git pull --rebase origin main
          git push origin HEAD:main
