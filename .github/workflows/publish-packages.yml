name: Publish Packages

# Pushes a finished release out to Winget, Homebrew, APT, AUR, and RPM.
#
# Three ways in:
#   1. workflow_call   — release-please chains straight into this after building.
#   2. workflow_run    — a tag pushed by hand runs "Release", which lands here.
#   3. workflow_dispatch — re-run one channel against any existing tag, without
#      rebuilding. This is the escape hatch for a winget submission that got
#      rejected or timed out: pick the tag, pick `winget`, go.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish"
        required: true
        type: string
      channels:
        description: "Comma-separated channels, or 'all'"
        required: false
        default: all
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (defaults to the latest release)"
        required: false
        type: string
      channels:
        description: "Which channels to publish"
        required: false
        default: all
        type: choice
        options: [all, winget, homebrew, apt, aur, rpm]

permissions:
  contents: read

jobs:
  # ── Shared: resolve the release tag and channel selection once ───────────
  resolve:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      channels: ${{ steps.tag.outputs.channels }}
    steps:
      - name: Resolve tag and channels
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_CHANNELS: ${{ inputs.channels }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo "$REPO" --json tagName -q .tagName)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "channels=${INPUT_CHANNELS:-all}" >> "$GITHUB_OUTPUT"
          echo "Publishing $TAG to: ${INPUT_CHANNELS:-all}"

  # ── Winget (Windows Package Manager) ─────────────────────────────────────
  # Submits a PR to microsoft/winget-pkgs automatically. komac carries the
  # previous version's metadata (description, tags, product codes) forward, so
  # the only thing a release has to get right is the .msi asset name.
  # Requires: WINGET_TOKEN secret (GitHub PAT, public_repo scope)
  winget:
    needs: resolve
    if: needs.resolve.outputs.channels == 'all' || contains(needs.resolve.outputs.channels, 'winget')
    runs-on: windows-latest
    steps:
      # Fail loudly and early, and say exactly what is wrong. komac's own error
      # is "<owner> does not have the correct permissions to execute CreateRef",
      # which is templated from its fork-user input rather than from the token —
      # so an EXPIRED token reads like a permissions problem and sends you
      # scope-hunting. That cost a release cycle on v0.1.3; this step tells you
      # which it actually is. Nothing here prints the token itself.
      - name: Validate WINGET_TOKEN
        shell: bash
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${WINGET_TOKEN}" ]; then
            echo "::error::WINGET_TOKEN is not set. Create a classic PAT with public_repo scope and add it as a repository secret."
            exit 1
          fi

          hdr=$(curl -sS -D - -o /dev/null \
                 -H "Authorization: Bearer ${WINGET_TOKEN}" \
                 -H "Accept: application/vnd.github+json" \
                 https://api.github.com/user)
          code=$(printf '%s' "$hdr" | awk 'NR==1{print $2}')
          scopes=$(printf '%s' "$hdr" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-oauth-scopes"{print $2}')
          expiry=$(printf '%s' "$hdr" | tr -d '\r' | awk -F': ' 'tolower($1)=="github-authentication-token-expiration"{print $2}')

          if [ "$code" != "200" ]; then
            echo "::error::WINGET_TOKEN was rejected by the GitHub API (HTTP $code). It has most likely EXPIRED — regenerate a classic PAT with public_repo scope and update the secret."
            exit 1
          fi
          echo "Token OK. scopes=[${scopes:-none}] expires=[${expiry:-never}]"

          # komac creates its branch in the FORK, not in microsoft/winget-pkgs,
          # so push on the fork is the permission that actually matters.
          perms=$(curl -sS -H "Authorization: Bearer ${WINGET_TOKEN}" \
                   -H "Accept: application/vnd.github+json" \
                   "https://api.github.com/repos/${{ github.repository_owner }}/winget-pkgs")
          if ! grep -q '"push": *true' <<<"$perms"; then
            echo "::error::WINGET_TOKEN cannot push to ${{ github.repository_owner }}/winget-pkgs. komac branches in your fork first — grant the token write access to that fork (classic PAT: public_repo)."
            exit 1
          fi
          echo "Fork push access confirmed on ${{ github.repository_owner }}/winget-pkgs"

      # THE failure mode for winget releases. komac creates its branch from the
      # fork's master; once the fork drifts far enough behind
      # microsoft/winget-pkgs, GitHub rejects the createRef and komac reports it
      # as "<owner> does not have the correct permissions to execute CreateRef" —
      # a permissions message for what is really a staleness problem. It cost
      # v0.1.3 two failed runs and sent us auditing a perfectly good token.
      #
      # Upstream tracks this in Komac#1142; the maintainer's answer is to sync the
      # fork manually, and notes `komac sync` reports success without actually
      # syncing. So do it here with GitHub's own merge-upstream API, every time.
      # Cheap, idempotent, and it makes the whole channel self-healing.
      - name: Sync the winget-pkgs fork with upstream
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${OWNER}/winget-pkgs/merge-upstream" \
            -f branch=master --jq '"\(.merge_type): \(.message)"' \
            || echo "::warning::Fork sync did not report success; continuing — komac may still fail on a stale fork."
          gh api "repos/${OWNER}/winget-pkgs/branches/master" \
            --jq '"fork master is now \(.commit.sha[0:10]) (\(.commit.commit.committer.date))"'

      # Release assets can lag a few seconds behind the release itself, and
      # winget-releaser resolves the .msi by URL. Confirm it is fetchable first
      # rather than letting the submission fail on a 404.
      - name: Wait for the MSI asset to be downloadable
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if gh release view "$TAG" --repo "$REPO" --json assets \
                 -q '.assets[].name' | grep -q '\.msi$'; then
              echo "MSI asset present on $TAG"
              exit 0
            fi
            echo "Attempt $attempt: no .msi on $TAG yet, retrying in 30s"
            sleep 30
          done
          echo "::error::No .msi asset found on $TAG after 5 minutes."
          exit 1

      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: cLLeB.Gear
          version: ${{ needs.resolve.outputs.version }}
          release-tag: ${{ needs.resolve.outputs.tag }}
          # Only the MSI. The NSIS setup.exe would collide with it as a second
          # x64 installer, and the .sig files must never be picked up.
          installers-regex: '\.msi$'
          max-versions-to-keep: 5
          release-notes-url: https://github.com/cLLeB/gear/releases/tag/${{ needs.resolve.outputs.tag }}
          token: ${{ secrets.WINGET_TOKEN }}

  # ── Homebrew Cask (macOS) ─────────────────────────────────────────────────
  # Updates the cask in the personal tap: github.com/cLLeB/homebrew-gear
  # Requires: HOMEBREW_TAP_TOKEN secret (GitHub PAT, public_repo scope on cLLeB/homebrew-gear)
  homebrew:
    needs: resolve
    if: needs.resolve.outputs.channels == 'all' || contains(needs.resolve.outputs.channels, 'homebrew')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      TAG: ${{ needs.resolve.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download universal DMG and compute SHA256
        run: |
          DMG_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/Gear_${VERSION}_universal.dmg"
          curl -fsSL "$DMG_URL" -o gear.dmg
          echo "sha256=$(sha256sum gear.dmg | awk '{print $1}')" >> $GITHUB_ENV

      - name: Checkout homebrew tap
        uses: actions/checkout@v4
        with:
          repository: cLLeB/homebrew-gear
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update cask version and SHA
        run: |
          sed -i "s/version \".*\"/version \"${VERSION}\"/" tap/Casks/gear.rb
          sed -i "s/sha256 \".*\"/sha256 \"${sha256}\"/" tap/Casks/gear.rb

      - name: Commit and push
        working-directory: tap
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/gear.rb
          git commit -m "chore: bump gear to ${VERSION}"
          git push

  # ── APT repository (Debian / Ubuntu) ─────────────────────────────────────
  # Publishes the .deb to a GPG-signed APT repo hosted on GitHub Pages.
  # Target repo: github.com/cLLeB/gear-packages  (gh-pages branch)
  #
  # Requires:
  #   GEAR_APT_GPG_KEY   — base64-encoded GPG private key (see docs/distribution.md)
  #   GEAR_APT_GPG_FP    — GPG fingerprint of the signing key
  #   PACKAGES_TOKEN     — GitHub PAT, public_repo scope on cLLeB/gear-packages
  apt:
    needs: resolve
    if: needs.resolve.outputs.channels == 'all' || contains(needs.resolve.outputs.channels, 'apt')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - name: Install repo tools
        run: sudo apt-get install -y dpkg-dev apt-utils

      - name: Import GPG signing key
        run: |
          echo "${{ secrets.GEAR_APT_GPG_KEY }}" | base64 -d | gpg --batch --import
          echo "${{ secrets.GEAR_APT_GPG_FP }}:6:" | gpg --import-ownertrust

      - name: Checkout packages repo
        uses: actions/checkout@v4
        with:
          repository: cLLeB/gear-packages
          token: ${{ secrets.PACKAGES_TOKEN }}
          path: pkgs

      - name: Download .deb
        run: |
          curl -fsSL \
            "https://github.com/${{ github.repository }}/releases/download/${TAG}/Gear_${VERSION}_amd64.deb" \
            -o "pkgs/apt/pool/main/gear_${VERSION}_amd64.deb"

      - name: Generate APT repo metadata
        working-directory: pkgs/apt
        run: |
          mkdir -p dists/stable/main/binary-amd64
          dpkg-scanpackages --arch amd64 pool/ > dists/stable/main/binary-amd64/Packages
          gzip -kf dists/stable/main/binary-amd64/Packages

          cat > dists/stable/Release <<EOF
          Origin: Gear
          Label: Gear
          Suite: stable
          Codename: stable
          Architectures: amd64
          Components: main
          Description: Gear APT repository
          EOF
          apt-ftparchive release dists/stable >> dists/stable/Release

          gpg --batch --yes --armor \
            -u "${{ secrets.GEAR_APT_GPG_FP }}" \
            --detach-sign \
            -o dists/stable/Release.gpg \
            dists/stable/Release

          gpg --batch --yes --armor \
            -u "${{ secrets.GEAR_APT_GPG_FP }}" \
            --clearsign \
            -o dists/stable/InRelease \
            dists/stable/Release

      - name: Commit and push
        working-directory: pkgs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apt/
          git commit -m "apt: release gear ${VERSION}"
          git push

  # ── AUR (Arch User Repository) ───────────────────────────────────────────
  # Updates gear-terminal-bin on AUR after each release.
  # Requires: AUR_SSH_KEY secret — contents of ~/.ssh/aur (the private key)
  aur:
    needs: resolve
    if: needs.resolve.outputs.channels == 'all' || contains(needs.resolve.outputs.channels, 'aur')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - name: Compute .deb SHA256
        run: |
          DEB_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/Gear_${VERSION}_amd64.deb"
          curl -fsSL "$DEB_URL" -o gear.deb
          echo "deb_sha256=$(sha256sum gear.deb | awk '{print $1}')" >> $GITHUB_ENV

      - name: Set up AUR SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_KEY }}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Clone AUR repo
        run: |
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur" \
            git clone ssh://aur@aur.archlinux.org/gear-terminal-bin.git aur-pkg

      - name: Write PKGBUILD and .SRCINFO
        working-directory: aur-pkg
        run: |
          SHA="${deb_sha256}"
          cat > PKGBUILD << EOF
          # Maintainer: cLLeB <kyereboatengcaleb@gmail.com>
          pkgname=gear-terminal-bin
          pkgver=${VERSION}
          pkgrel=1
          pkgdesc="AI-native developer terminal built on Tauri and Rust"
          arch=('x86_64')
          url="https://gear.kyere.me"
          license=('Apache-2.0')
          depends=('webkit2gtk-4.1' 'gtk3')
          provides=('gear-terminal')
          conflicts=('gear-terminal')
          source_x86_64=("https://github.com/cLLeB/gear/releases/download/v\${pkgver}/Gear_\${pkgver}_amd64.deb")
          sha256sums_x86_64=('${SHA}')

          package() {
            cd "\$srcdir"
            bsdtar -xf data.tar.zst -C "\$pkgdir/"
          }
          EOF

          cat > .SRCINFO << EOF
          pkgbase = gear-terminal-bin
          	pkgdesc = AI-native developer terminal built on Tauri and Rust
          	pkgver = ${VERSION}
          	pkgrel = 1
          	url = https://gear.kyere.me
          	arch = x86_64
          	license = Apache-2.0
          	depends = webkit2gtk-4.1
          	depends = gtk3
          	provides = gear-terminal
          	conflicts = gear-terminal
          	source_x86_64 = https://github.com/cLLeB/gear/releases/download/v${VERSION}/Gear_${VERSION}_amd64.deb
          	sha256sums_x86_64 = ${SHA}

          pkgname = gear-terminal-bin
          EOF

      - name: Commit and push to AUR
        working-directory: aur-pkg
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "upgrade: ${VERSION}"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur" git push origin master

  # ── RPM repository (Fedora / RHEL / openSUSE) ────────────────────────────
  # Publishes the .rpm to a repo hosted on GitHub Pages.
  # Target repo: github.com/cLLeB/gear-packages (same repo as APT, rpm/ subdir)
  #
  # Requires:
  #   PACKAGES_TOKEN — GitHub PAT, public_repo scope on cLLeB/gear-packages
  rpm:
    needs: [resolve, apt]  # run after apt so git pushes don't conflict
    # `always()` is required because apt is skipped when only rpm is selected,
    # and a skipped dependency would otherwise skip this job too. The explicit
    # result checks keep the original ordering guarantee: never publish rpm on
    # top of a *failed* apt push.
    if: |
      always()
      && needs.resolve.result == 'success'
      && (needs.apt.result == 'success' || needs.apt.result == 'skipped')
      && (needs.resolve.outputs.channels == 'all' || contains(needs.resolve.outputs.channels, 'rpm'))
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - name: Install createrepo
        run: sudo apt-get install -y createrepo-c

      - name: Checkout packages repo
        uses: actions/checkout@v4
        with:
          repository: cLLeB/gear-packages
          token: ${{ secrets.PACKAGES_TOKEN }}
          path: pkgs

      - name: Download .rpm
        run: |
          curl -fsSL \
            "https://github.com/${{ github.repository }}/releases/download/${TAG}/Gear-${VERSION}-1.x86_64.rpm" \
            -o "pkgs/rpm/Gear-${VERSION}-1.x86_64.rpm"

      - name: Generate RPM repo metadata
        working-directory: pkgs/rpm
        run: createrepo_c .

      - name: Commit and push
        working-directory: pkgs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage + commit before rebasing: createrepo_c and the downloaded rpm
          # leave a dirty tree, and `git pull --rebase` aborts on unstaged changes.
          git add rpm/
          git commit -m "rpm: release gear ${VERSION}"
          git pull --rebase  # pick up apt job's push
          git push
