name: Release

on:
  push:
    tags:
      - "v*"
      - "Gear-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (defaults to the ref this runs on)"
        required: false
        type: string
  # Called by release-please.yml the moment it cuts a release. A tag pushed by
  # release-please carries GITHUB_TOKEN, and GITHUB_TOKEN-created events never
  # start a new workflow run — so the `push: tags` trigger above simply does not
  # fire for automated releases. Being callable closes that gap without a PAT:
  # the build runs as part of the release-please run itself.
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Single source of truth for the tag, so every downstream step works the same
  # whether we got here from a tag push, a manual dispatch, or release-please.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve the tag to build
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"
          case "$TAG" in
            v*|Gear-v*) ;;
            *) echo "::error::'$TAG' is not a release tag. Dispatch this workflow on a tag, or pass one via the 'tag' input."; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building $TAG"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            bundles: "dmg,app"
            extra_args: "--target universal-apple-darwin"
            # Must match the app's target so Tauri finds the sidecar; the CLI
            # build script lipos the two arches for this alias.
            cli-target: "universal-apple-darwin"
          - platform: ubuntu-latest
            bundles: "appimage,deb,rpm"
            extra_args: ""
            cli-target: "x86_64-unknown-linux-gnu"
          - platform: windows-latest
            bundles: "msi,nsis"
            extra_args: ""
            cli-target: "x86_64-pc-windows-msvc"
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Explicit: when called by release-please the run's ref is `main`, and
          # main may already have moved past the release commit.
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            libglib2.0-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            libsoup-3.0-dev

      - name: Install Windows MSI tooling
        if: matrix.platform == 'windows-latest'
        run: choco install wixtoolset -y

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      # release-please bumps src-tauri/Cargo.toml but has no updater for
      # Cargo.lock — `cargo-lock` is wired only into its `rust` strategy, and a
      # `generic` x-release-please-version annotation is useless here because
      # cargo strips comments from the lock on the next write. So the lock still
      # names the previous version, and `cargo build --locked` in
      # scripts/build-cli.mjs refuses to proceed. That is exactly what broke the
      # first v0.1.3 build on all three platforms.
      #
      # `--workspace` re-locks only the three local crates, never dependencies,
      # so this cannot silently drift a dependency version.
      - name: Sync Cargo.lock with the release version
        run: cargo update --workspace --manifest-path src-tauri/Cargo.toml

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin the sidecar's target so a host-arch guess can't ship the wrong
          # helper (e.g. an arm64 CLI inside an x86_64 bundle).
          GEAR_CLI_TARGET: ${{ matrix.cli-target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.resolve.outputs.tag }}
          releaseName: "Gear ${{ needs.resolve.outputs.tag }}"
          releaseDraft: false
          prerelease: false
          args: --bundles ${{ matrix.bundles }} ${{ matrix.extra_args }}

      # Strip outdated bundled libwayland-* from the AppImage so it loads the
      # host's libs. The build host's libwayland (1.20) shadows newer Mesa
      # (1.22+ symbols), breaking EGL with EGL_BAD_PARAMETER; host copies are
      # ABI-stable and on the AppImage excludelist for exactly this reason.
      - name: Fix AppImage wayland libs and re-sign
        if: matrix.platform == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APPIMAGE=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)
          BASENAME=$(basename "$APPIMAGE")
          echo "Patching: $APPIMAGE"
          WORK=$(mktemp -d)
          cp "$APPIMAGE" "$WORK/"
          pushd "$WORK" >/dev/null
          chmod +x "./$BASENAME"
          "./$BASENAME" --appimage-extract >/dev/null
          rm -f squashfs-root/usr/lib/libwayland-client.so.0 \
                squashfs-root/usr/lib/libwayland-egl.so.1 \
                squashfs-root/usr/lib/libwayland-cursor.so.0
          curl -fsSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run squashfs-root "$BASENAME"
          popd >/dev/null
          cp "$WORK/$BASENAME" "$APPIMAGE"
          rm -f "$APPIMAGE.sig"
          pnpm tauri signer sign "$APPIMAGE"
          # latest.json is NOT patched here. tauri-action uploads its own copy
          # from every matrix job, so a local edit would be overwritten by
          # whichever platform finishes last. The patch-updater-manifest job
          # below runs after all of them and fixes the published manifest.
          gh release upload "$TAG" "$APPIMAGE" "$APPIMAGE.sig" \
            --clobber --repo "$GITHUB_REPOSITORY"

  patch-updater-manifest:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The AppImage is rebuilt and re-signed above, so the manifest tauri-action
      # published carries the pre-re-sign signature. Re-uploading with --clobber
      # also deletes and recreates the asset under a new id, which invalidates the
      # asset-id API url tauri-action baked into latest.json. Fix both: substitute
      # the regenerated signature and point the url at the tag+filename download
      # url, which is stable across clobbers.
      - name: Patch latest.json with the re-signed AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "latest.json" \
            --pattern "*_amd64.AppImage.sig" --clobber

          APP_SIG=$(cat ./*_amd64.AppImage.sig)
          APP_FILE=$(basename "$(ls ./*_amd64.AppImage.sig)" .sig)
          DL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          jq -e 'has("platforms") and (.platforms | has("linux-x86_64"))' \
            latest.json >/dev/null \
            || { echo "latest.json missing the linux-x86_64 platform key"; exit 1; }

          jq --arg app "$APP_SIG" --arg appurl "$DL/$APP_FILE" '
            .platforms["linux-x86_64"] += {signature: $app, url: $appurl}
            | (if .platforms["linux-x86_64-appimage"]
               then .platforms["linux-x86_64-appimage"] += {signature: $app, url: $appurl}
               else . end)
          ' latest.json > latest.json.tmp
          mv latest.json.tmp latest.json

          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
