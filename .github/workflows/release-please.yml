name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4.1.3
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Merging the release PR tags the repo with GITHUB_TOKEN, and GitHub refuses
  # to start new workflow runs from GITHUB_TOKEN-created events — so release.yml's
  # `push: tags` trigger never fires for an automated release. Before this, every
  # release needed a manual `workflow_dispatch` to actually build (see v0.1.2).
  # Calling the workflows instead keeps them in *this* run, where no new event is
  # needed, so merge → build → publish is one unbroken chain and no PAT is involved.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: write
    secrets: inherit

  # The release commit leaves src-tauri/Cargo.lock naming the previous version
  # (see the comment in release.yml). release.yml repairs it in the build tree,
  # but main would stay inconsistent, so every `cargo --locked` command would
  # fail for developers until someone happened to re-run cargo. Push the
  # three-line sync back to main instead. GITHUB_TOKEN is deliberate: its push
  # cannot trigger another workflow run, so this cannot loop.
  sync-lockfile:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
      - name: Re-lock the workspace crates
        run: cargo update --workspace --manifest-path src-tauri/Cargo.toml
      - name: Commit if the lock moved
        run: |
          set -euo pipefail
          if git diff --quiet -- src-tauri/Cargo.lock; then
            echo "Cargo.lock already in sync."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git commit -m "chore: sync Cargo.lock with ${{ needs.release-please.outputs.tag_name }}"
          git push origin main

  publish:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/publish-packages.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: read
    secrets: inherit
